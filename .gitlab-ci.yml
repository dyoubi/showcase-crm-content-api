variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  IMAGE_TAG: git-${CI_COMMIT_SHA}
  KUBECONFIG_SUFFIX: DEFAULT

  # Build resources
  KUBERNETES_CPU_REQUEST: 1500m
  KUBERNETES_CPU_LIMIT: 2000m
  KUBERNETES_MEMORY_REQUEST: 5Gi
  KUBERNETES_MEMORY_LIMIT: 7Gi

  DEVELOP_PULUMI_STACK: content-manager-develop
  MAIN_PULUMI_STACK: content-manager-main
  PRODUCTION_PULUMI_STACK: content-manager-production

  # Not used by pulumi/helm
  DEVELOP_HOST: develop.content.egamingchain.io
  MAIN_HOST: main.content.egamingchain.io
  PRODUCTION_HOST: content.egamingchain.io

default:
  tags:
    - kubernetes

stages:
  - lint
  - build
  - test
  - build-image
  - deploy-preview
  - deploy

.rule-develop: &rule-develop
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
  variables:
    PULUMI_STACK: ${DEVELOP_PULUMI_STACK}
    IMAGE_TAG2: git-${CI_COMMIT_SHA}
    IMAGE_TAG: branch-${CI_COMMIT_BRANCH}
.rule-main: &rule-main
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"
  variables:
    PULUMI_STACK: ${MAIN_PULUMI_STACK}
    IMAGE_TAG2: git-${CI_COMMIT_SHA}
    IMAGE_TAG: branch-${CI_COMMIT_BRANCH}
.rule-tag: &rule-tag
  if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v\d+.\d+$/
  variables:
    PULUMI_STACK: ${PRODUCTION_PULUMI_STACK}
    KUBECONFIG_SUFFIX: PRODUCTION
    IMAGE_TAG: ${CI_COMMIT_TAG}

.rules-all: &rules-all
  - *rule-develop
  - *rule-main
  - *rule-tag
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.rules-deploy-preview: &rules-deploy-preview
  - *rule-develop
  - *rule-main
  - *rule-tag
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
    variables:
      PULUMI_STACK: ${DEVELOP_PULUMI_STACK}
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    variables:
      PULUMI_STACK: ${MAIN_PULUMI_STACK}

###
### Lint
###

lint:
  stage: lint
  image: node:23
  before_script:
    - corepack enable
    - corepack --version
    - corepack prepare pnpm@latest-9 --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install
    - echo WARN needs lint rules
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
  rules: *rules-all
  allow_failure: true

###
### Build
###

build:
  stage: build
  image: node:23
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-9 --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install
    - pnpm run build:all
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store
      - .pnpm-store
      - packages/
  rules: *rules-all

###
### Test
###

test:
  stage: test
  image: node:23
  before_script:
   - corepack enable
   - corepack prepare pnpm@latest-9 --activate
   - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install
    - echo WARN needs unit testing
  cache:
   key: ${CI_COMMIT_REF_SLUG}
   paths:
     - .pnpm-store
     - .pnpm-store
     - packages/
  dependencies:
    - build
  rules: *rules-all

###
### Build Image
###

.pulumi:
  image:
    name: pulumi/pulumi
    entrypoint: [""]
  before_script:
    - export VAR_NAME="KUBECONFIG_${KUBECONFIG_SUFFIX}"
    - export KUBECONFIG="${!VAR_NAME}"
    - cd .k8s/pulumi/
    - npm ci

build-image:
  stage: build-image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    CI_REGISTRY_IMAGE: ${REGISTRY_IMAGE}
  script:
    - .k8s/scripts/kaniko_build_image.sh
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - packages/
  dependencies:
    - build
  rules: *rules-all

###
### Preview
###

deploy-preview:
  stage: deploy-preview
  extends: .pulumi
  script:
    - pulumi preview --stack $PULUMI_STACK --non-interactive --color=always --diff
  needs:
    - build-image
  rules: *rules-deploy-preview

###
### Deploy
###

.deploy:
  stage: deploy
  extends: .pulumi
  script:
    - pulumi up --stack $PULUMI_STACK --non-interactive --color=always --refresh --skip-preview --yes
  dependencies:
    - build-image

deploy-develop:
  extends: .deploy
  environment:
    name: develop
    deployment_tier: development
    url: https://${DEVELOP_HOST}
  rules:
    - *rule-develop

deploy-main:
  extends: .deploy
  environment:
    name: main
    deployment_tier: staging
    url: https://${MAIN_HOST}
  rules:
    - *rule-main

deploy-production:
  extends: .deploy
  environment:
    name: production
    deployment_tier: production
    url: https://${PRODUCTION_HOST}
  rules:
    - *rule-tag
