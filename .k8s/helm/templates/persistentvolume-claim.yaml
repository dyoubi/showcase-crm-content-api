apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "content-manager.fullname" . }}-pv-claim
  labels:
    {{- include "content-manager.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-2"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ include "content-manager.fullname" . }}-pv
  resources:
    requests:
      storage: {{ .Values.fileSystem.size }}
