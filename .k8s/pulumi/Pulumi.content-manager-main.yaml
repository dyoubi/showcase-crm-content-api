config:
  aws:region: ca-central-1
  content-manager:helm:
    autoscaling:
      enabled: true
    envVars:
      AUTH_ENDPOINT: https://main.authentication.egamingchain.io/
      AUTH_CLIENT_ID: egccontent
      ENVIRONMENT: main
      LOG: debug
      REDIS_DB_DEFAULT: "0"
      REDIS_URL: redis://redis-main-master.servers-infra:6379/
    fullnameOverride: content-main
    ingressClass: nginx
    namespace: content-manager
    replicaCount: 1
  content-manager:helmEnvVarsSecret: {}
  content-manager:hostnames:
    - main.content.egamingchain.io
  content-manager:protect: "false"
  content-manager:rds:
    allocatedStorage: 20
    dbName: ringcontent
    dbSubnetGroupName: nonprod-rds
    engineVersion: "16.3"
    identifier: main-content-manager
    instanceClass: db.t3.small
    maxAllocatedStorage: 200
    multiAz: false
    username: ringcontent
  content-manager:rdsParameterGroup:
    family: "postgres16"
    name: "rds-pg-ringcontent-main"
    parameters:
      - applyMethod: "immediate"
        name: 'rds.force_ssl'
        value: "0"
  content-manager:infraStack: infra-main