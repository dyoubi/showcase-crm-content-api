apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "content-manager.fullname" . }}-env
  labels:
    {{- include "content-manager.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
data:
  {{- toYaml .Values.envVars | nindent 2 }}
