apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "content-manager.fullname" . }}-pv
  labels:
    {{- include "content-manager.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-3"
spec:
  capacity:
    storage: {{ .Values.fileSystem.size }}
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: {{ .Values.fileSystem.id }}
