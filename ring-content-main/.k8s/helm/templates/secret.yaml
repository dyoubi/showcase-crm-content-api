apiVersion: v1
kind: Secret
metadata:
  name: {{ include "content-manager.fullname" . }}-env
  labels:
    {{- include "content-manager.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-2"
type: Opaque
stringData:
  {{- toYaml .Values.envVarsSecret | nindent 2 }}
